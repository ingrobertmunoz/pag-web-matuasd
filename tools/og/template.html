<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: linear-gradient(135deg, #003B73 0%, #002949 50%, #001829 100%);
    font-family: 'Source Sans 3', sans-serif;
    color: #fff;
    position: relative;
  }

  /* Retícula matemática de fondo */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Halo naranja */
  .glow {
    position: absolute;
    width: 720px; height: 720px;
    right: -260px; top: -240px;
    background: radial-gradient(circle, rgba(255,111,0,.28) 0%, rgba(255,111,0,0) 68%);
  }

  /* Motivo matemático grande, muy tenue */
  .motif {
    position: absolute;
    right: 56px;
    bottom: -70px;
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 380px;
    line-height: 1;
    color: rgba(255,255,255,.055);
    user-select: none;
    white-space: nowrap;
  }

  /* Barra naranja lateral */
  .accent {
    position: absolute;
    left: 0; top: 0;
    width: 14px; height: 100%;
    background: linear-gradient(180deg, #FF6F00 0%, #CC5900 100%);
  }

  .wrap {
    position: relative;
    height: 100%;
    padding: 76px 92px 68px 92px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #FF8F33;
  }

  h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-weight: 400;
    font-size: 92px;
    line-height: 1.06;
    letter-spacing: -.015em;
    max-width: 15ch;
    text-wrap: balance;
  }
  h1.long   { font-size: 76px; }
  h1.longer { font-size: 63px; }

  .rule {
    width: 96px; height: 6px;
    background: #FF6F00;
    border-radius: 3px;
    margin: 30px 0 26px;
  }

  p.sub {
    font-size: 31px;
    font-weight: 300;
    line-height: 1.38;
    color: rgba(255,255,255,.80);
    max-width: 27ch;
  }

  .foot {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .foot .chip {
    width: 72px; height: 72px;
    border-radius: 16px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 18px rgba(0,0,0,.28);
  }
  .foot .chip img { width: 56px; height: 56px; object-fit: contain; }
  .brand {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 34px;
    letter-spacing: .02em;
  }
  .domain {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 21px;
    color: rgba(255,255,255,.55);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="motif">{{MOTIF}}</div>
  <div class="accent"></div>

  <div class="wrap">
    <div>
      <div class="eyebrow">{{EYEBROW}}</div>
      <div class="rule"></div>
      <h1 class="{{SIZE}}">{{TITLE}}</h1>
    </div>

    <div>
      <p class="sub">{{SUBTITLE}}</p>
    </div>

    <div class="foot">
      <span class="chip"><img src="{{LOGO}}" alt=""></span>
      <span class="brand">MATUASD</span>
      <span class="domain">matuasd.com</span>
    </div>
  </div>
</body>
</html>
